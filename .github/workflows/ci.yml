name: Build XboxVR Driver

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade "ninja>=1,<2"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Show tool versions
        shell: pwsh
        run: |
          Write-Host "=== Tool versions ==="
          cmake --version
          ninja --version
          dotnet --info
          Write-Host "====================="

      - name: Install OpenVR SDK
        shell: pwsh
        run: |
          .\scripts\fetch_openvr.ps1 `
            -Destination "$env:GITHUB_WORKSPACE\openvr-sdk"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            -DOPENVR_ROOT="$env:GITHUB_WORKSPACE\openvr-sdk" `
            -DOPENVR_LIB="$env:GITHUB_WORKSPACE\openvr-sdk\lib\win64\openvr_api.lib" `
            -DBUILD_PREVIEW_APP=OFF `
            -DBUILD_TESTING=OFF `
            -DOPENVR_EMULATOR_SKIP_DEPLOY=ON

      - name: Build driver
        shell: pwsh
        run: |
          cmake --build build `
            --config ${{ matrix.config }} `
            --target driver_openvr-emulator `
            --parallel

      - name: Verify Release outputs
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $dll = "build\Release\openvr-emulator\bin\win64\driver_openvr-emulator.dll"

          if (!(Test-Path $dll)) {
            Write-Error "Release driver DLL not found: $dll"

            Write-Host ""
            Write-Host "Searching build directory for DLL files..."
            Get-ChildItem build -Recurse -Filter "*.dll" |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Release DLL found: $dll"
          Get-FileHash $dll -Algorithm SHA256

          "DRIVER_DLL=$dll" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      # ================================================================
      # HIDMAESTRO BRIDGE
      # ================================================================

      - name: Setup HIDMaestro dependency
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"

          Write-Host "Bridge root:"
          Write-Host $bridgeRoot

          if (!(Test-Path "$bridgeRoot\XboxVR-HIDMaestroBridge.csproj")) {
            Write-Error "Bridge project not found."
            exit 1
          }

          if (!(Test-Path "$bridgeRoot\setup_hidmaestro.ps1")) {
            Write-Error "setup_hidmaestro.ps1 not found."
            exit 1
          }

          # The setup script downloads HIDMaestro.Core.dll.
          # It may return a non-zero code because its normal local-use
          # instructions expect the bridge to be run as Administrator.
          & "$bridgeRoot\setup_hidmaestro.ps1" -SkipBuild

          Write-Host ""
          Write-Host "HIDMaestro setup script completed."

          # Do NOT use $LASTEXITCODE here.
          # CI only needs the downloaded dependency; SteamVR driver
          # registration is a runtime/local-machine operation.

          $coreCandidates = @(
            "$bridgeRoot\HIDMaestro.Core.dll",
            "$bridgeRoot\HIDMaestro\HIDMaestro.Core.dll",
            "$bridgeRoot\bin\HIDMaestro.Core.dll"
          )

          $core = $coreCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$core) {
            Write-Error "HIDMaestro.Core.dll was not found after setup."

            Write-Host ""
            Write-Host "Bridge directory contents:"
            Get-ChildItem $bridgeRoot -Recurse |
              Select-Object FullName

            exit 1
          }

          Write-Host "HIDMaestro.Core.dll found:"
          Write-Host $core

          Get-FileHash $core -Algorithm SHA256

      - name: Restore HIDMaestro bridge
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"
          $project = "$bridgeRoot\XboxVR-HIDMaestroBridge.csproj"

          Write-Host "Restoring:"
          Write-Host $project

          dotnet restore $project

          if ($LASTEXITCODE -ne 0) {
            Write-Error "HIDMaestro bridge restore failed."
            exit $LASTEXITCODE
          }

          Write-Host "HIDMaestro bridge restore succeeded."

      - name: Publish HIDMaestro bridge
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"
          $project = "$bridgeRoot\XboxVR-HIDMaestroBridge.csproj"
          $bridgeOut = "$bridgeRoot\publish"

          Write-Host "Project:"
          Write-Host $project

          Write-Host "Publish directory:"
          Write-Host $bridgeOut

          # Always start from a clean output directory.
          if (Test-Path $bridgeOut) {
            Remove-Item $bridgeOut -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $bridgeOut `
            -Force |
            Out-Null

          dotnet publish `
            $project `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $bridgeOut `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            Write-Error "HIDMaestro bridge publish failed."

            Write-Host ""
            Write-Host "Bridge project contents:"
            Get-ChildItem $bridgeRoot -Recurse |
              Select-Object FullName

            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=== HIDMaestro publish output ==="

          Get-ChildItem $bridgeOut -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host "================================="

          $exe = "$bridgeOut\XboxVR-HIDMaestroBridge.exe"
          $core = "$bridgeOut\HIDMaestro.Core.dll"

          if (!(Test-Path $exe)) {
            Write-Error "XboxVR-HIDMaestroBridge.exe was not produced."
            exit 1
          }

          if (!(Test-Path $core)) {
            Write-Error "HIDMaestro.Core.dll was not copied to publish output."
            exit 1
          }

          Write-Host ""
          Write-Host "HIDMaestro bridge publish succeeded."
          Write-Host "EXE: $exe"
          Write-Host "DLL: $core"

      # ================================================================
      # PACKAGE COMPLETE STEAMVR DRIVER
      # ================================================================

      - name: Prepare complete SteamVR driver
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\driver_files\driver\openvr-emulator"
          $packageRoot = "$env:GITHUB_WORKSPACE\XboxVR-Driver"
          $package = "$packageRoot\driver\openvr-emulator"

          if (!(Test-Path "$source\driver.vrdrivermanifest")) {
            Write-Error "driver.vrdrivermanifest not found at $source"
            exit 1
          }

          if (!(Test-Path "$source\resources")) {
            Write-Error "Driver resources directory not found at $source"
            exit 1
          }

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force |
            Out-Null

          Copy-Item `
            "$source\*" `
            "$package\" `
            -Recurse `
            -Force

          $destinationBin = "$package\bin\win64"

          New-Item `
            -ItemType Directory `
            -Path $destinationBin `
            -Force |
            Out-Null

          Copy-Item `
            "$env:DRIVER_DLL" `
            "$destinationBin\driver_openvr-emulator.dll" `
            -Force

          Write-Host ""
          Write-Host "=== Complete SteamVR driver package ==="

          Get-ChildItem $packageRoot -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          # ------------------------------------------------------------
          # HIDMaestro bridge
          # ------------------------------------------------------------

          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"
          $bridgeOut = "$bridgeRoot\publish"
          $bridgePackage = "$packageRoot\XboxVR-HIDMaestroBridge"

          Write-Host ""
          Write-Host "=== HIDMaestro bridge packaging ==="
          Write-Host "Source: $bridgeOut"
          Write-Host "Destination: $bridgePackage"

          if (!(Test-Path $bridgeOut)) {
            Write-Error "HIDMaestro bridge publish directory not found:"
            Write-Host $bridgeOut

            Write-Host ""
            Write-Host "Bridge root contents:"
            Get-ChildItem $bridgeRoot -Recurse |
              Select-Object FullName

            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Path $bridgePackage `
            -Force |
            Out-Null

          Copy-Item `
            "$bridgeOut\*" `
            "$bridgePackage\" `
            -Recurse `
            -Force

          # Launcher
          $launcher = "$env:GITHUB_WORKSPACE\Launch-XboxVR.ps1"

          if (!(Test-Path $launcher)) {
            Write-Error "Launch-XboxVR.ps1 not found."
            exit 1
          }

          Copy-Item `
            $launcher `
            "$packageRoot\Launch-XboxVR.ps1" `
            -Force

          # HIDMaestro setup helper
          $setupScript = "$bridgeRoot\setup_hidmaestro.ps1"

          if (!(Test-Path $setupScript)) {
            Write-Error "setup_hidmaestro.ps1 not found."
            exit 1
          }

          Copy-Item `
            $setupScript `
            "$bridgePackage\setup_hidmaestro.ps1" `
            -Force

          # Validate bridge
          $bridgeExe = "$bridgePackage\XboxVR-HIDMaestroBridge.exe"
          $bridgeCore = "$bridgePackage\HIDMaestro.Core.dll"

          if (!(Test-Path $bridgeExe)) {
            Write-Error "Bridge executable missing:"
            Write-Host $bridgeExe

            Get-ChildItem $bridgePackage -Recurse
            exit 1
          }

          if (!(Test-Path $bridgeCore)) {
            Write-Error "HIDMaestro.Core.dll missing:"
            Write-Host $bridgeCore

            Get-ChildItem $bridgePackage -Recurse
            exit 1
          }

          Write-Host ""
          Write-Host "HIDMaestro bridge package validated."

      # ================================================================
      # VALIDATE COMPLETE PACKAGE
      # ================================================================

      - name: Validate driver package
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\XboxVR-Driver\driver\openvr-emulator"
          $bridge = "$env:GITHUB_WORKSPACE\XboxVR-Driver\XboxVR-HIDMaestroBridge"

          $required = @(
            "$root\driver.vrdrivermanifest",
            "$root\bin\win64\driver_openvr-emulator.dll",
            "$root\resources\input_mapping.ini",
            "$root\resources\localization\localization.json",
            "$root\resources\input\openvr-emulator_controller_bindings.json",
            "$root\resources\input\openvr-emulator_controller_left.svg",
            "$root\resources\input\openvr-emulator_controller_right.svg",
            "$bridge\XboxVR-HIDMaestroBridge.exe",
            "$bridge\HIDMaestro.Core.dll",
            "$bridge\setup_hidmaestro.ps1",
            "$env:GITHUB_WORKSPACE\XboxVR-Driver\Launch-XboxVR.ps1"
          )

          $failed = $false

          foreach ($file in $required) {
            if (Test-Path $file) {
              Write-Host "[OK] $file"
            }
            else {
              Write-Host "[MISSING] $file"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Error "Complete XboxVR package validation failed."
            exit 1
          }

          Write-Host ""
          Write-Host "Complete XboxVR package validation PASSED."

      # ================================================================
      # ZIP
      # ================================================================

      - name: Create complete driver ZIP
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\XboxVR-Driver-${{ github.sha }}.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\XboxVR-Driver\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Get-FileHash $zip -Algorithm SHA256

          Write-Host ""
          Write-Host "Created:"
          Write-Host $zip

      - name: Upload complete SteamVR driver
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: XboxVR-Driver-${{ github.sha }}
          path: XboxVR-Driver-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
