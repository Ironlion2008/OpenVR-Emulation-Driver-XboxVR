name: Build XboxVR Driver

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        shell: pwsh
        run: python -m pip install --upgrade "ninja>=1,<2"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install OpenVR SDK
        shell: pwsh
        run: |
          .\scripts\fetch_openvr.ps1 `
            -Destination "$env:GITHUB_WORKSPACE\openvr-sdk"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            -DOPENVR_ROOT="$env:GITHUB_WORKSPACE\openvr-sdk" `
            -DOPENVR_LIB="$env:GITHUB_WORKSPACE\openvr-sdk\lib\win64\openvr_api.lib" `
            -DBUILD_PREVIEW_APP=OFF `
            -DBUILD_TESTING=OFF `
            -DOPENVR_EMULATOR_SKIP_DEPLOY=ON

      - name: Build driver
        shell: pwsh
        run: |
          cmake --build build `
            --config ${{ matrix.config }} `
            --target driver_openvr-emulator `
            --parallel

      - name: Verify Release outputs
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $dll = "build\Release\openvr-emulator\bin\win64\driver_openvr-emulator.dll"

          if (!(Test-Path $dll)) {
            Write-Error "Release driver DLL not found: $dll"
            Write-Host "Searching build directory..."
            Get-ChildItem build -Recurse -Filter "*.dll"
            exit 1
          }

          Write-Host "Release DLL found: $dll"
          Get-FileHash $dll -Algorithm SHA256
          "DRIVER_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup and build HIDMaestro bridge
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"

          & "$bridgeRoot\setup_hidmaestro.ps1" -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish "$bridgeRoot\XboxVR-HIDMaestroBridge.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$bridgeRoot\publish"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (!(Test-Path "$bridgeRoot\publish\XboxVR-HIDMaestroBridge.exe")) {
            Write-Error "HIDMaestro bridge executable was not produced."
            Get-ChildItem "$bridgeRoot" -Recurse | Select-Object FullName
            exit 1
          }

          if (!(Test-Path "$bridgeRoot\publish\HIDMaestro.Core.dll")) {
            Write-Error "HIDMaestro.Core.dll was not produced/copied."
            Get-ChildItem "$bridgeRoot" -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "HIDMaestro bridge publish succeeded."
          Get-ChildItem "$bridgeRoot\publish" -File |
            ForEach-Object { Write-Host $_.FullName }

      - name: Prepare complete SteamVR driver
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\driver_files\driver\openvr-emulator"
          $packageRoot = "$env:GITHUB_WORKSPACE\XboxVR-Driver"
          $package = "$packageRoot\driver\openvr-emulator"

          if (!(Test-Path "$source\driver.vrdrivermanifest")) {
            Write-Error "driver.vrdrivermanifest not found at $source"
            exit 1
          }

          if (!(Test-Path "$source\resources")) {
            Write-Error "Driver resources directory not found at $source"
            exit 1
          }

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "$source\*" "$package\" -Recurse -Force

          $destinationBin = "$package\bin\win64"
          New-Item -ItemType Directory -Path $destinationBin -Force | Out-Null

          Copy-Item `
            "$env:DRIVER_DLL" `
            "$destinationBin\driver_openvr-emulator.dll" `
            -Force

          Write-Host "Complete SteamVR driver package:"
          Get-ChildItem $packageRoot -Recurse -File |
            ForEach-Object { Write-Host $_.FullName }

          # ------------------------------------------------------------
          # Package HIDMaestro consumer bridge.
          # Find the actual win-x64 output directory instead of assuming
          # a specific .NET target-framework path.
          # ------------------------------------------------------------

          $bridgeRoot = "$env:GITHUB_WORKSPACE\tools\XboxVR-HIDMaestroBridge"
          $bridgePackage = "$packageRoot\XboxVR-HIDMaestroBridge"

          Write-Host ""
          Write-Host "Searching for HIDMaestro bridge output..."

          $bridgeOut = Get-ChildItem `
            "$bridgeRoot\bin\Release" `
            -Directory `
            -Recurse |
            Where-Object {
              $_.Name -eq "win-x64"
            } |
            Select-Object -First 1

          if (-not $bridgeOut) {
            Write-Error "XboxVR-HIDMaestroBridge win-x64 output directory was not found."

            Write-Host ""
            Write-Host "Contents of bridge bin directory:"
            if (Test-Path "$bridgeRoot\bin") {
              Get-ChildItem "$bridgeRoot\bin" -Recurse |
                Select-Object FullName
            }
            else {
              Write-Host "Bridge bin directory does not exist."
            }

            exit 1
          }

          Write-Host "Using bridge output:"
          Write-Host $bridgeOut.FullName

          New-Item `
            -ItemType Directory `
            -Path $bridgePackage `
            -Force |
            Out-Null

          Copy-Item `
            "$($bridgeOut.FullName)\*" `
            "$bridgePackage\" `
            -Recurse `
            -Force

          # Launcher
          Copy-Item `
            "$env:GITHUB_WORKSPACE\Launch-XboxVR.ps1" `
            "$packageRoot\Launch-XboxVR.ps1" `
            -Force

          # HIDMaestro setup helper
          Copy-Item `
            "$bridgeRoot\setup_hidmaestro.ps1" `
            "$bridgePackage\setup_hidmaestro.ps1" `
            -Force

          # Validate bridge package
          if (!(Test-Path "$bridgePackage\XboxVR-HIDMaestroBridge.exe")) {
            Write-Error "Bridge executable missing."
            Write-Host "Bridge package contents:"
            Get-ChildItem $bridgePackage -Recurse
            exit 1
          }

          if (!(Test-Path "$bridgePackage\HIDMaestro.Core.dll")) {
            Write-Error "HIDMaestro.Core.dll missing."
            Write-Host "Bridge package contents:"
            Get-ChildItem $bridgePackage -Recurse
            exit 1
          }

          Write-Host "HIDMaestro bridge package validated."

      - name: Validate driver package
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\XboxVR-Driver\driver\openvr-emulator"

          $required = @(
            "$root\driver.vrdrivermanifest",
            "$root\bin\win64\driver_openvr-emulator.dll",
            "$root\resources\input_mapping.ini",
            "$root\resources\localization\localization.json",
            "$root\resources\input\openvr-emulator_controller_bindings.json",
            "$root\resources\input\openvr-emulator_controller_left.svg",
            "$root\resources\input\openvr-emulator_controller_right.svg"
          )

          $failed = $false

          foreach ($file in $required) {
            if (Test-Path $file) {
              Write-Host "[OK] $file"
            }
            else {
              Write-Host "[MISSING] $file"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Error "SteamVR driver package validation failed."
            exit 1
          }

          Write-Host "SteamVR driver package validation PASSED."

      - name: Create complete driver ZIP
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\XboxVR-Driver-${{ github.sha }}.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\XboxVR-Driver\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Get-FileHash $zip -Algorithm SHA256
          Write-Host "Created: $zip"

      - name: Upload complete SteamVR driver
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: XboxVR-Driver-${{ github.sha }}
          path: XboxVR-Driver-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
