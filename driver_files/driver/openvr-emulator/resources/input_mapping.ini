; OpenVR Emulator - Xbox 360 / XInput controller mapping
; This driver is Xbox/XInput-only for VR controller input.
; Restart SteamVR after changing this file.
;
; Supported XInput button names:
; A B X Y START BACK
; LEFT_SHOULDER RIGHT_SHOULDER LEFT_THUMB RIGHT_THUMB
; DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT

[hmd]
; Mouse is used for HMD look. The Xbox controller is reserved for VR hands.
key_mouse_toggle  = VK_SPACE
mouse_sensitivity = 0.003

[left_controller]
btn_x               = X
btn_y               = Y
btn_grip            = LEFT_SHOULDER
btn_system          = BACK
btn_joystick_click  = LEFT_THUMB
stick_deadzone      = 7849
trigger_deadzone    = 30
stick_sensitivity   = 1.0
trigger_click_threshold = 0.75
dpad_to_trackpad    = 1

[right_controller]
btn_a               = A
btn_b               = B
btn_grip            = RIGHT_SHOULDER
btn_system          = START
btn_joystick_click  = RIGHT_THUMB
stick_deadzone      = 8689
trigger_deadzone    = 30
stick_sensitivity   = 1.0
trigger_click_threshold = 0.75
dpad_to_trackpad    = 0
